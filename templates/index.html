<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #7c3aed;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --dark-color: #1f2937;
            --light-color: #f9fafb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem 0;
        }

        .main-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 2rem;
            margin: 0 auto;
            max-width: 1400px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 3px solid var(--primary-color);
        }

        .header h1 {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #6b7280;
            font-size: 1.1rem;
        }

        .stats-card {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stats-card h3 {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .stats-card p {
            margin: 0;
            opacity: 0.9;
        }

        .btn-primary {
            background: var(--primary-color);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }

        .product-card {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s;
        }

        .product-card:hover {
            border-color: var(--primary-color);
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.1);
            transform: translateY(-2px);
        }

        .product-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--dark-color);
            margin-bottom: 0.5rem;
        }

        .product-description {
            color: #6b7280;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .product-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .badge {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .badge-category {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-price {
            background: #d1fae5;
            color: #065f46;
            font-size: 1.1rem;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3f4f6;
            padding: 0.5rem;
            border-radius: 10px;
        }

        .quantity-control button {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            border: none;
            background: var(--primary-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quantity-control button:hover {
            background: var(--secondary-color);
            transform: scale(1.1);
        }

        .quantity-control input {
            width: 60px;
            text-align: center;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 0.4rem;
            font-weight: 600;
        }

        .btn-delete {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-delete:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        .modal-content {
            border-radius: 20px;
            border: none;
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 20px 20px 0 0;
            border: none;
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #e5e7eb;
            padding: 0.75rem;
            transition: all 0.3s;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #6b7280;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .filter-section {
            background: #f9fafb;
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 2rem;
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }

        .search-box input {
            padding-left: 2.5rem;
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 1rem;
            }
            
            .product-details {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-container">
            <!-- Header -->
            <div class="header">
                <h1><i class="bi bi-box-seam"></i> Inventory Management System</h1>
                <p>Manage your products efficiently and effectively</p>
            </div>

            <!-- Stats Cards -->
            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="stats-card">
                        <h3 id="totalProducts">0</h3>
                        <p><i class="bi bi-boxes"></i> Total Products</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stats-card" style="background: linear-gradient(135deg, #10b981, #059669);">
                        <h3 id="totalItems">0</h3>
                        <p><i class="bi bi-stack"></i> Total Items in Stock</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stats-card" style="background: linear-gradient(135deg, #f59e0b, #d97706);">
                        <h3 id="totalValue">$0.00</h3>
                        <p><i class="bi bi-cash-stack"></i> Total Inventory Value</p>
                    </div>
                </div>
            </div>

            <!-- Filter and Add Product Section -->
            <div class="filter-section">
                <div class="row align-items-center">
                    <div class="col-md-4 mb-3 mb-md-0">
                        <div class="search-box">
                            <i class="bi bi-search"></i>
                            <input type="text" id="searchInput" class="form-control" placeholder="Search products...">
                        </div>
                    </div>
                    <div class="col-md-3 mb-3 mb-md-0">
                        <select id="categoryFilter" class="form-select">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3 mb-md-0">
                        <select id="sortBy" class="form-select">
                            <option value="name">Sort by Name</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="quantity">Quantity</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#addProductModal">
                            <i class="bi bi-plus-circle"></i> Add Product
                        </button>
                    </div>
                </div>
            </div>

            <!-- Products List -->
            <div id="productsList">
                <div class="empty-state">
                    <i class="bi bi-hourglass-split"></i>
                    <h3>Loading products...</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Product Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-plus-circle"></i> Add New Product</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addProductForm">
                        <div class="mb-3">
                            <label for="productName" class="form-label">Product Name *</label>
                            <input type="text" class="form-control" id="productName" required>
                        </div>
                        <div class="mb-3">
                            <label for="productDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="productDescription" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="productPrice" class="form-label">Price ($) *</label>
                                <input type="number" step="0.01" class="form-control" id="productPrice" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="productQuantity" class="form-label">Quantity *</label>
                                <input type="number" class="form-control" id="productQuantity" value="0" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="productCategory" class="form-label">Category</label>
                            <select class="form-select" id="productCategory">
                                <option value="General">General</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Accessories">Accessories</option>
                                <option value="Office">Office</option>
                                <option value="Furniture">Furniture</option>
                                <option value="Storage">Storage</option>
                                <option value="Stationery">Stationery</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addProduct()">
                        <i class="bi bi-check-circle"></i> Add Product
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let products = [];
        let filteredProducts = [];

        // Load products on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            
            // Add event listeners for filters
            document.getElementById('searchInput').addEventListener('input', filterProducts);
            document.getElementById('categoryFilter').addEventListener('change', filterProducts);
            document.getElementById('sortBy').addEventListener('change', filterProducts);
        });

        // Load all products from API
        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                products = await response.json();
                filteredProducts = [...products];
                
                // Populate category filter
                populateCategoryFilter();
                
                // Update stats and display products
                updateStats();
                displayProducts();
            } catch (error) {
                console.error('Error loading products:', error);
                showError('Failed to load products');
            }
        }

        // Populate category filter dropdown
        function populateCategoryFilter() {
            const categories = [...new Set(products.map(p => p.category))];
            const categoryFilter = document.getElementById('categoryFilter');
            
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categoryFilter.appendChild(option);
            });
        }

        // Filter products based on search, category, and sort
        function filterProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            // Filter
            filteredProducts = products.filter(product => {
                const matchesSearch = product.name.toLowerCase().includes(searchTerm) ||
                                    product.description.toLowerCase().includes(searchTerm);
                const matchesCategory = !category || product.category === category;
                return matchesSearch && matchesCategory;
            });

            // Sort
            switch (sortBy) {
                case 'name':
                    filteredProducts.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'price-low':
                    filteredProducts.sort((a, b) => a.price - b.price);
                    break;
                case 'price-high':
                    filteredProducts.sort((a, b) => b.price - a.price);
                    break;
                case 'quantity':
                    filteredProducts.sort((a, b) => b.quantity - a.quantity);
                    break;
            }

            displayProducts();
        }

        // Display products
        function displayProducts() {
            const productsList = document.getElementById('productsList');
            
            if (filteredProducts.length === 0) {
                productsList.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <h3>No products found</h3>
                        <p>Try adjusting your filters or add a new product</p>
                    </div>
                `;
                return;
            }

            productsList.innerHTML = filteredProducts.map(product => `
                <div class="product-card">
                    <div class="product-name">${escapeHtml(product.name)}</div>
                    <div class="product-description">${escapeHtml(product.description || 'No description')}</div>
                    <div class="product-details">
                        <span class="badge badge-category">${escapeHtml(product.category)}</span>
                        <span class="badge badge-price">$${product.price.toFixed(2)}</span>
                        <div class="quantity-control">
                            <button onclick="updateQuantity(${product.id}, Math.max(0, ${product.quantity - 1}))">
                                <i class="bi bi-dash"></i>
                            </button>
                            <input type="number" value="${product.quantity}" 
                                   onchange="updateQuantity(${product.id}, this.value)"
                                   min="0">
                            <button onclick="updateQuantity(${product.id}, ${product.quantity + 1})">
                                <i class="bi bi-plus"></i>
                            </button>
                            <span style="margin-left: 0.5rem; font-weight: 600; color: #6b7280;">in stock</span>
                        </div>
                        <button class="btn-delete" onclick="deleteProduct(${product.id})">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Update statistics
        function updateStats() {
            const totalProducts = products.length;
            const totalItems = products.reduce((sum, p) => sum + p.quantity, 0);
            const totalValue = products.reduce((sum, p) => sum + (p.quantity * p.price), 0);

            document.getElementById('totalProducts').textContent = totalProducts;
            document.getElementById('totalItems').textContent = totalItems.toLocaleString();
            document.getElementById('totalValue').textContent = `$${totalValue.toFixed(2)}`;
        }

        // Add new product
        async function addProduct() {
            const name = document.getElementById('productName').value.trim();
            const description = document.getElementById('productDescription').value.trim();
            const price = parseFloat(document.getElementById('productPrice').value);
            const quantity = parseInt(document.getElementById('productQuantity').value);
            const category = document.getElementById('productCategory').value;

            if (!name || isNaN(price) || isNaN(quantity) || price <= 0 || quantity < 0) {
                showError('Please fill in all required fields correctly. Price must be positive and quantity cannot be negative.');
                return;
            }

            try {
                const response = await fetch('/api/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description, price, quantity, category })
                });

                if (response.ok) {
                    // Close modal and reset form
                    bootstrap.Modal.getInstance(document.getElementById('addProductModal')).hide();
                    document.getElementById('addProductForm').reset();
                    
                    // Reload products
                    await loadProducts();
                    showSuccess('Product added successfully!');
                } else {
                    const error = await response.json();
                    showError(error.error || 'Failed to add product');
                }
            } catch (error) {
                console.error('Error adding product:', error);
                showError('Failed to add product');
            }
        }

        // Update product quantity
        async function updateQuantity(productId, newQuantity) {
            newQuantity = parseInt(newQuantity);
            
            if (isNaN(newQuantity) || newQuantity < 0) {
                showError('Please enter a valid non-negative quantity');
                await loadProducts();
                return;
            }

            try {
                const response = await fetch(`/api/products/${productId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quantity: newQuantity })
                });

                if (response.ok) {
                    await loadProducts();
                } else {
                    const error = await response.json();
                    showError(error.error || 'Failed to update quantity');
                    await loadProducts();
                }
            } catch (error) {
                console.error('Error updating quantity:', error);
                showError('Failed to update quantity');
                await loadProducts();
            }
        }

        // Delete product
        async function deleteProduct(productId) {
            if (!confirm('Are you sure you want to delete this product?')) {
                return;
            }

            try {
                const response = await fetch(`/api/products/${productId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    await loadProducts();
                    showSuccess('Product deleted successfully!');
                } else {
                    const error = await response.json();
                    showError(error.error || 'Failed to delete product');
                }
            } catch (error) {
                console.error('Error deleting product:', error);
                showError('Failed to delete product');
            }
        }

        // Utility function to escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Show success message
        function showSuccess(message) {
            // Simple alert for now - could be enhanced with toast notifications
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert alert-success position-fixed top-0 start-50 translate-middle-x mt-3';
            alertDiv.style.zIndex = '9999';
            alertDiv.textContent = message;
            document.body.appendChild(alertDiv);
            setTimeout(() => alertDiv.remove(), 3000);
        }

        // Show error message
        function showError(message) {
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert alert-danger position-fixed top-0 start-50 translate-middle-x mt-3';
            alertDiv.style.zIndex = '9999';
            alertDiv.textContent = message;
            document.body.appendChild(alertDiv);
            setTimeout(() => alertDiv.remove(), 3000);
        }
    </script>
</body>
</html>
